worker_processes 1;
error_log /dev/stdout info;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;

    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    server {
        listen 8080;
        server_name _;

        location /kekevpn { 
            proxy_pass http://127.0.0.1:10000; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_buffering off;
        }
        location /kekevpn-hu { 
            proxy_pass http://127.0.0.1:10001; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_buffering off;
        }
        location /vmess-kekevpn { 
            proxy_pass http://127.0.0.1:10003; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_buffering off;
        }
        location /vmess-kekevpn-hu { 
            proxy_pass http://127.0.0.1:10004; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_buffering off;
        }
        location /vless-kekevpn { 
            proxy_pass http://127.0.0.1:10006; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_buffering off;
        }
        location /vless-kekevpn-hu { 
            proxy_pass http://127.0.0.1:10007; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_buffering off;
        }
        location /ss-kekevpn { 
            proxy_pass http://127.0.0.1:10009; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_buffering off;
        }
        location /ss-kekevpn-hu { 
            proxy_pass http://127.0.0.1:10010; 
            proxy_http_version 1.1; 
            proxy_set_header Upgrade $http_upgrade; 
            proxy_set_header Connection "upgrade"; 
            proxy_set_header Host $host; 
            proxy_buffering off;
        }

        location / { 
            root /usr/local/openresty/nginx/html; 
            index index.html; 
        }
    }
}
