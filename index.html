<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KEKEVPN CONFIG PANEL</title>
    <style>
        :root {
            --bg-deep: #080c14;
            --surface: #0f172a;
            --surface-hover: #1e293b;
            --border: rgba(56, 189, 248, 0.2);
            --border-glow: rgba(56, 189, 248, 0.5);
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            --success: #34d399;
            --warning: #fbbf24;
            --error: #f87171;
            --radius: 12px;
        }

        * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent;}

        body {
            min-height: 100vh;
            color: var(--text);
            background: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .panel-header {
            text-align: center;
            padding: 10px 0;
        }
        .panel-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .panel-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        .vpn-status-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        .vpn-status-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--accent-gradient);
        }
        .status-indicator {
            width: 48px; height: 48px; margin: 0 auto 10px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--border);
        }
        .status-indicator.connected {border-color: var(--success); color: var(--success); background: rgba(52, 211, 153, 0.1);}
        .status-indicator.checking {border-color: var(--warning); color: var(--warning); animation: pulse 1.2s infinite;}
        .status-indicator.disconnected {border-color: var(--error); color: var(--error); background: rgba(248, 113, 113, 0.1);}
        @keyframes pulse {0% {box-shadow: 0 0 0 0 rgba(251,191,36,0.2);} 70% {box-shadow: 0 0 0 10px rgba(251,191,36,0);} 100% {box-shadow: 0 0 0 0 rgba(251,191,36,0);}}
        .status-text {font-size: 16px; font-weight: 700; margin-bottom: 2px;}
        .status-subtext {font-size: 11px; color: var(--text-secondary);}

        .info-grid {display: grid; grid-template-columns: 1fr 1fr; gap: 8px;}
        .info-box {background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px;}
        .info-box.full {grid-column: 1 / -1;}
        .info-label {font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;}
        .info-value {font-size: 13px; font-weight: 600; color: var(--accent); word-break: break-all;}
        .info-value.success {color: var(--success);}

        .system-log-box {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
        }
        .log-header {display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;}
        .log-title {font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px;}
        .log-clear {font-size: 11px; color: var(--accent); cursor: pointer; transition: opacity 0.2s;}
        .log-clear:hover {opacity: 0.8;}
        .log-content {
            width: 100%; min-height: 80px; max-height: 110px; overflow-y: auto;
            background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
            font-family: 'JetBrains Mono', monosp
